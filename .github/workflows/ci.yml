name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, and iOS export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build and service worker
        run: pnpm build
      - name: iOS export marks the page as the app
        run: |
          BUILD_TARGET=ios pnpm exec next build --webpack
          grep -q 'data-app="ios"' out/index.html

  e2e:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # Browsers and their system packages come with the image; keep its tag equal to @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build and service worker
        run: pnpm build
      - name: Browser tests (Chromium and WebKit)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

  ci:
    # The main branch ruleset requires a check named CI.
    name: CI
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.e2e.result }}" = success
